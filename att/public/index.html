<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MS SQL Query Runner</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 16px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .description {
        font-size: 0.9rem;
        color: #555;
        margin-bottom: 16px;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        font-family: monospace;
        font-size: 14px;
        padding: 8px;
        box-sizing: border-box;
      }

      .buttons {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }

      pre {
        margin-top: 20px;
        padding: 12px;
        background: #f5f5f5;
        border: 1px solid #ddd;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>MS SQL Query Runner</h1>
    <p class="description">
      Type any MS SQL query below and click <strong>Run Query</strong>, or use
      the sample INSERT/UPDATE buttons.
    </p>
    <div class="buttons">
      <button id="selectSampleBtn" type="button">Sample SELECT</button>
      <button id="insertSampleBtn" type="button">Sample INSERT</button>
      <button id="updateSampleBtn" type="button">Sample UPDATE</button>
    </div>

    <textarea id="query" placeholder="Write a SQL query here..."></textarea>

    <div class="buttons">
      <button id="runBtn" type="button">Run Query</button>
    </div>

    <pre id="result"></pre>

    <script>
      const textarea = document.getElementById("query");
      const runBtn = document.getElementById("runBtn");
      const insertSampleBtn = document.getElementById("insertSampleBtn");
      const updateSampleBtn = document.getElementById("updateSampleBtn");
      const selectSampleBtn = document.getElementById("selectSampleBtn");
      const resultEl = document.getElementById("result");

      // INSERT sample (with all NULL columns removed)
      const SAMPLE_INSERT = `
INSERT INTO DeviceLogs_11_2025 (
    DownloadDate,
    DeviceId,
    UserId,
    LogDate,
    Direction,
    AttDirection,
    StatusCode,
    WorkCode,
    VerificationMode,
    IsApproved,
    LogRecordLocation,
    AttenndanceMarkingType,
    Lattitude,
    Longitude,
    NetworkLattitude,
    Temperature,
    TemperatureState
)
VALUES (
    '2025-11-20 08:27:40.000',
    18,
    N'7744',
    '2025-11-20 08:26:23.000',
    N'in',
    N' ',
    N'0',
    N'0',
    N'1004',
    1,
    N'',
    N'Biometric',
    N'',
    N'',
    N'',
    0.0,
    0
);
`.trim();

      // UPDATE sample (same schema, example WHERE)
      const SAMPLE_UPDATE = `
UPDATE DeviceLogs_11_2025
SET
    DownloadDate = '2025-11-01 00:04:46.000',
    DeviceId = 18,
    UserId = 1234,
    LogDate = '2025-11-01 00:04:29.000'
WHERE
    DeviceLogId = 18;
`.trim();
      //select sample query
      const SAMPLE_SELECT = `
SELECT * FROM DeviceLogs_11_2025
WHERE
    UserId = '18'
    AND
    CAST(LogDate AS DATE) = '2025-11-01';
`.trim();

      insertSampleBtn.addEventListener("click", () => {
        textarea.value = SAMPLE_INSERT;
      });

      updateSampleBtn.addEventListener("click", () => {
        textarea.value = SAMPLE_UPDATE;
      });

      selectSampleBtn.addEventListener("click", () => {
        textarea.value = SAMPLE_SELECT;
      });

      runBtn.addEventListener("click", async () => {
        const query = textarea.value.trim();
        if (!query) {
          alert("Please enter a SQL query.");
          return;
        }

        resultEl.textContent = "Running query...";

        try {
          const res = await fetch("/api/query", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ query }),
          });

          const data = await res.json();

          if (!res.ok) {
            resultEl.textContent = "Error: " + (data.error || res.statusText);
            return;
          }

          resultEl.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          resultEl.textContent = "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
